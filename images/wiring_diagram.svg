<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Lab 8 wiring: UART, I²C and SPI on the ESP32 (WROOM-32)</text>

  <!-- ESP32 board -->
  <rect x="60" y="50" width="200" height="545" rx="12" fill="#eef2f7" stroke="#333" stroke-width="2"/>
  <text x="160" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">ESP32 DevKit</text>
  <text x="160" y="94" text-anchor="middle" font-size="13" fill="#333">(WROOM-32)</text>

  <!-- UART pins -->
  <text x="248" y="124" text-anchor="end" font-size="13" fill="#111">GPIO17 · UART TX</text>
  <text x="248" y="164" text-anchor="end" font-size="13" fill="#111">GPIO16 · UART RX</text>
  <circle cx="260" cy="120" r="6" fill="#2e7d32"/>
  <circle cx="260" cy="160" r="6" fill="#2e7d32"/>
  <path d="M260 120 H340 V160 H260" fill="none" stroke="#2e7d32" stroke-width="4"/>
  <text x="355" y="145" font-size="14" fill="#2e7d32" font-weight="bold">Jumper: GPIO17 → GPIO16</text>
  <text x="355" y="163" font-size="12" fill="#2e7d32">UART loopback (Serial2, 9600 baud)</text>

  <!-- SPI pins -->
  <text x="248" y="244" text-anchor="end" font-size="13" fill="#111">GPIO13 · SPI MOSI</text>
  <text x="248" y="284" text-anchor="end" font-size="13" fill="#111">GPIO26 · SPI MISO</text>
  <text x="248" y="324" text-anchor="end" font-size="13" fill="#111">GPIO14 · SPI SCK</text>
  <text x="248" y="364" text-anchor="end" font-size="13" fill="#111">GPIO4 · SPI CS</text>
  <circle cx="260" cy="240" r="6" fill="#6a1b9a"/>
  <circle cx="260" cy="280" r="6" fill="#6a1b9a"/>
  <circle cx="260" cy="320" r="6" fill="#999"/>
  <circle cx="260" cy="360" r="6" fill="#999"/>
  <path d="M260 240 H340 V280 H260" fill="none" stroke="#6a1b9a" stroke-width="4"/>
  <text x="355" y="265" font-size="14" fill="#6a1b9a" font-weight="bold">Jumper: GPIO13 → GPIO26</text>
  <text x="355" y="283" font-size="12" fill="#6a1b9a">SPI loopback (1 MHz, mode 0, MSB first)</text>
  <text x="285" y="325" font-size="12" fill="#666">no wire (clock, used by the sketch)</text>
  <text x="285" y="365" font-size="12" fill="#666">no wire (chip select, used by the sketch)</text>

  <!-- I2C pins and wires -->
  <text x="248" y="444" text-anchor="end" font-size="13" fill="#111">GPIO32 · I²C SDA</text>
  <text x="248" y="484" text-anchor="end" font-size="13" fill="#111">GPIO33 · I²C SCL</text>
  <text x="248" y="524" text-anchor="end" font-size="13" fill="#111">3V3</text>
  <text x="248" y="564" text-anchor="end" font-size="13" fill="#111">GND</text>
  <circle cx="260" cy="440" r="6" fill="#1565c0"/>
  <circle cx="260" cy="480" r="6" fill="#ef6c00"/>
  <circle cx="260" cy="520" r="6" fill="#c62828"/>
  <circle cx="260" cy="560" r="6" fill="#424242"/>
  <line x1="260" y1="440" x2="640" y2="440" stroke="#1565c0" stroke-width="4"/>
  <line x1="260" y1="480" x2="640" y2="480" stroke="#ef6c00" stroke-width="4"/>
  <line x1="260" y1="520" x2="640" y2="520" stroke="#c62828" stroke-width="4"/>
  <line x1="260" y1="560" x2="640" y2="560" stroke="#424242" stroke-width="4"/>
  <text x="450" y="432" text-anchor="middle" font-size="13" fill="#1565c0">GPIO32 → SDA</text>
  <text x="450" y="472" text-anchor="middle" font-size="13" fill="#ef6c00">GPIO33 → SCK (= SCL)</text>
  <text x="450" y="512" text-anchor="middle" font-size="13" fill="#c62828">3V3 → VDD (VCC)</text>
  <text x="450" y="552" text-anchor="middle" font-size="13" fill="#424242">GND → GND</text>

  <!-- OLED module -->
  <rect x="640" y="400" width="200" height="190" rx="10" fill="#e8f0fe" stroke="#333" stroke-width="2"/>
  <text x="740" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">OLED module</text>
  <circle cx="640" cy="440" r="6" fill="#1565c0"/>
  <circle cx="640" cy="480" r="6" fill="#ef6c00"/>
  <circle cx="640" cy="520" r="6" fill="#c62828"/>
  <circle cx="640" cy="560" r="6" fill="#424242"/>
  <text x="655" y="444" font-size="13" fill="#111">SDA</text>
  <text x="655" y="484" font-size="13" fill="#111">SCK (= SCL)</text>
  <text x="655" y="524" font-size="13" fill="#111">VDD (VCC)</text>
  <text x="655" y="564" font-size="13" fill="#111">GND</text>

  <!-- Notes -->
  <text x="450" y="402" text-anchor="middle" font-size="12" fill="#333">I²C device: SSD1306 OLED (address 0x3C)</text>
  <text x="450" y="622" text-anchor="middle" font-size="12" fill="#333">Power the OLED from 3V3 only. Disconnect USB before changing any wire. The OLED's SCK pin is the I²C clock, not SPI SCK.</text>
</svg>
